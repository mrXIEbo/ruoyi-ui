<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>签名授权</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h2 { color: #6c5ce7; margin-bottom: 4px; font-size: 18px; }
  .subtitle { color: #888; font-size: 13px; margin-bottom: 20px; }

  .card {
    background: #16213e;
    border-radius: 12px;
    padding: 16px;
    width: 100%;
    max-width: 420px;
    margin-bottom: 16px;
    border: 1px solid #2d2d5a;
  }

  .row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #2d2d5a;
    font-size: 14px;
    align-items: center;
  }
  .row:last-child { border-bottom: none; }
  .label { color: #888; }
  .value { color: #e0e0e0; font-family: monospace; font-size: 12px; word-break: break-all; text-align: right; max-width: 60%; }

  .chain-badge {
    display: inline-block;
    background: #6c5ce7;
    color: #fff;
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 12px;
    font-weight: bold;
  }

  .btn {
    width: 100%;
    max-width: 420px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 10px;
    transition: opacity .2s;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: #6c5ce7; color: #fff; }
  .btn-success { background: #00b894; color: #fff; }
  .btn-danger  { background: #d63031; color: #fff; }

  #signed-hex-wrap { display: none; margin-top: 10px; }
  #signed-hex-wrap textarea {
    width: 100%; min-height: 80px; background: #0d0d2b;
    color: #a8ff78; border: 1px solid #2d2d5a;
    border-radius: 8px; padding: 10px; font-family: monospace;
    font-size: 12px; resize: vertical; outline: none;
  }

  #status { text-align: center; font-size: 13px; margin: 10px 0; min-height: 20px; }
  .status-ok { color: #00b894; }
  .status-err { color: #d63031; }
  .status-info { color: #74b9ff; }

  .note {
    background: #0d0d2b;
    border-left: 3px solid #6c5ce7;
    padding: 10px 12px;
    border-radius: 0 8px 8px 0;
    font-size: 12px;
    color: #aaa;
    line-height: 1.6;
    margin-top: 10px;
    width: 100%;
    max-width: 420px;
  }
</style>
</head>
<body>

<h2>🔐 签名授权</h2>
<div class="subtitle" id="subtitle">连接钱包后签名转账交易</div>

<div class="card" id="tx-card" style="display:none">
  <div class="row">
    <span class="label">链</span>
    <span class="value"><span class="chain-badge" id="tx-chain"></span></span>
  </div>
  <div class="row">
    <span class="label">代币</span>
    <span class="value" id="tx-token"></span>
  </div>
  <div class="row">
    <span class="label">发款地址</span>
    <span class="value" id="tx-from"></span>
  </div>
  <div class="row">
    <span class="label">收款地址</span>
    <span class="value" id="tx-to"></span>
  </div>
  <div class="row">
    <span class="label">金额</span>
    <span class="value" id="tx-amount"></span>
  </div>
</div>

<div id="status"></div>

<button class="btn btn-primary" id="btn-connect" onclick="connect()">🔗 连接 MetaMask</button>
<button class="btn btn-success" id="btn-sign" disabled onclick="sign()">✍️ 签名交易</button>

<div id="signed-hex-wrap">
  <label style="font-size:13px;color:#888;margin-bottom:4px;display:block">✅ 签名结果（已复制到剪贴板）：</label>
  <textarea id="signed-hex" readonly></textarea>
</div>

<div class="note">
  💡 签名后，请复制上方显示的 HEX 数据，<br>
  返回 Telegram 粘贴发送即可。
</div>

<script>
let ethers = null;
let txData = null;
let signer = null;
let provider = null;

const statusEl = document.getElementById('status');

function setStatus(msg, type='') {
  statusEl.textContent = msg;
  statusEl.className = type ? 'status-' + type : '';
}

function fmtAddr(addr) {
  if (!addr) return '';
  return addr.length > 20 ? addr.slice(0,10)+'...'+addr.slice(-8) : addr;
}

// ─── 用 <script> 标签加载 ethers.js（多源兜底） ───
function loadScript(url) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = url;
    s.onload = () => resolve(url);
    s.onerror = () => { s.remove(); reject(new Error('load fail: ' + url)); };
    document.head.appendChild(s);
  });
}

async function loadEthers() {
  // 优先国内 CDN
  const cdnList = [
    'https://cdn.bootcdn.net/ajax/libs/ethers/5.7.2/ethers.umd.min.js',
    'https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js',
    'https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js',
  ];

  for (const url of cdnList) {
    try {
      setStatus('加载签名组件...', 'info');
      await loadScript(url);
      // UMD 通过 window.ethers 暴露
      ethers = window.ethers;
      if (ethers && ethers.utils && typeof ethers.utils.parseEther === 'function') {
        console.log('ethers loaded from:', url);
        return;
      }
      // 加载了但全局变量不对，清理重试
      ethers = null;
    } catch(e) {
      console.warn('CDN failed:', url, e.message);
    }
  }
  throw new Error('无法加载 ethers.js，请检查网络连接');
}

// ─── 解析 URL 参数 ───
function getParam(key) {
  const params = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
  return params.get(key);
}

async function init() {
  // 1. 加载 ethers
  await loadEthers();

  // 2. 解析交易参数
  const encoded = getParam('tx');
  if (!encoded) {
    setStatus('⚠️ 未找到交易参数，请从 Telegram 重新发起', 'err');
    return;
  }

  try {
    txData = JSON.parse(atob(encoded));
  } catch(e) {
    try {
      const padded = encoded.replace(/-/g, '+').replace(/_/g, '/');
      txData = JSON.parse(atob(padded));
    } catch(e2) {
      setStatus('⚠️ 交易参数解析失败', 'err');
      return;
    }
  }

  document.getElementById('tx-card').style.display = 'block';
  document.getElementById('tx-chain').textContent = txData.chain;
  document.getElementById('tx-token').textContent = txData.token;
  document.getElementById('tx-from').textContent = fmtAddr(txData.from);
  document.getElementById('tx-to').textContent = fmtAddr(txData.to);
  document.getElementById('tx-amount').textContent = txData.amount + ' ' + txData.token;

  setStatus('请先连接 MetaMask', 'info');
}

async function connect() {
  if (!window.ethereum) {
    setStatus('⚠️ 未检测到 MetaMask，请先安装 MetaMask 插件', 'err');
    return;
  }

  setStatus('正在打开 MetaMask...', 'info');
  try {
    provider = new ethers.providers.Web3Provider(window.ethereum);
    await provider.send('eth_requestAccounts', []);

    signer = provider.getSigner();
    const addr = await signer.getAddress();

    document.getElementById('btn-connect').disabled = true;
    document.getElementById('btn-connect').textContent = '✅ 已连接: ' + fmtAddr(addr);
    document.getElementById('btn-sign').disabled = false;
    setStatus('✅ MetaMask 已连接：' + addr, 'ok');
  } catch(e) {
    if (e.code === 4001) {
      setStatus('⚠️ 用户拒绝连接', 'err');
    } else {
      setStatus('⚠️ 连接失败: ' + e.message, 'err');
    }
  }
}

async function sign() {
  if (!provider || !signer) {
    setStatus('⚠️ 请先连接钱包', 'err');
    return;
  }

  setStatus('请在 MetaMask 中确认签名...', 'info');
  document.getElementById('btn-sign').disabled = true;

  try {
    const chain  = txData.chain;
    const from   = txData.from;
    const to     = txData.to;
    const amount = txData.amount;
    const token  = txData.token;

    // 验证链
    const expectedChain = { 'ETH': 1, 'BSC': 56 }[chain];
    if (expectedChain) {
      const network = await provider.getNetwork();
      if (Number(network.chainId) !== expectedChain) {
        setStatus(`⚠️ 请先切换 MetaMask 到 ${chain} 网络（ID: ${expectedChain}）`, 'err');
        document.getElementById('btn-sign').disabled = false;
        return;
      }
    }

    // 验证地址
    const connectedAddr = (await signer.getAddress()).toLowerCase();
    if (connectedAddr !== from.toLowerCase()) {
      setStatus(`⚠️ 钱包地址与发款地址不匹配\n发款：${from}\n连接：${connectedAddr}`, 'err');
      document.getElementById('btn-sign').disabled = false;
      return;
    }

    const txCount = await provider.getTransactionCount(from, 'latest');
    const gasPrice = await provider.getGasPrice();
    const chainId = parseInt(txData.chainId);

    if (token === 'ETH' || token === 'BNB') {
      // ── 原生币 ──
      const txRequest = {
        from,
        to,
        value: ethers.utils.parseEther(amount.toString()),
        nonce: txCount,
        gasLimit: 21000,
        gasPrice: gasPrice,
        chainId: chainId,
      };
      const signature = await signer.signTransaction(txRequest);
      const signedHex = ethers.utils.serializeTransaction(txRequest, signature);
      showResult(signedHex);
    } else {
      // ── USDT ERC20 ──
      const usdtContract = chain === 'BSC'
        ? '0x55d398326f99059ff775485246999027b3197955'
        : '0xdac17f958d2ee523a2206206994597c13d831ec7';

      const iface = new ethers.utils.Interface([
        'function transfer(address to, uint amount) public'
      ]);
      // USDT 是 6 位小数
      const tokenAmount = ethers.utils.parseUnits(amount.toString(), 6);
      const data = iface.encodeFunctionData('transfer', [to, tokenAmount]);

      const txRequest = {
        from,
        to: usdtContract,
        value: ethers.constants.Zero,
        data,
        nonce: txCount,
        gasLimit: 100000,
        gasPrice: gasPrice,
        chainId: chainId,
      };
      const signedTx = await signer.signTransaction(txRequest);
      showResult(signedTx);
    }
  } catch(e) {
    console.error(e);
    if (e.code === 4001 || e.code === 'ACTION_REJECTED') {
      setStatus('⚠️ 用户取消签名', 'err');
    } else {
      setStatus('⚠️ 签名失败: ' + e.message, 'err');
    }
    document.getElementById('btn-sign').disabled = false;
  }
}

function showResult(hex) {
  setStatus('✅ 签名成功！', 'ok');
  document.getElementById('signed-hex').value = hex;
  document.getElementById('signed-hex-wrap').style.display = 'block';
  navigator.clipboard.writeText(hex).then(() => {
    setStatus('✅ 签名成功！HEX 已复制到剪贴板，返回 Telegram 粘贴', 'ok');
  }).catch(() => {
    setStatus('✅ 签名成功！请手动复制 HEX 返回 Telegram', 'ok');
  });
}

init().catch(e => setStatus('初始化错误: ' + e.message, 'err'));
</script>
</body>
</html>
