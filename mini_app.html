<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>签名授权</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h2 { color: #6c5ce7; margin-bottom: 4px; font-size: 18px; }
  .subtitle { color: #888; font-size: 13px; margin-bottom: 20px; }

  .card {
    background: #16213e;
    border-radius: 12px;
    padding: 16px;
    width: 100%;
    max-width: 420px;
    margin-bottom: 16px;
    border: 1px solid #2d2d5a;
  }

  .row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #2d2d5a;
    font-size: 14px;
    align-items: center;
  }
  .row:last-child { border-bottom: none; }
  .label { color: #888; }
  .value { color: #e0e0e0; font-family: monospace; font-size: 12px; word-break: break-all; text-align: right; max-width: 60%; }

  .chain-badge {
    display: inline-block;
    background: #6c5ce7;
    color: #fff;
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 12px;
    font-weight: bold;
  }

  .btn {
    width: 100%;
    max-width: 420px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 10px;
    transition: opacity .2s;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: #6c5ce7; color: #fff; }
  .btn-success { background: #00b894; color: #fff; }
  .btn-danger  { background: #d63031; color: #fff; }

  #signed-hex-wrap { display: none; margin-top: 10px; }
  #signed-hex-wrap textarea {
    width: 100%; min-height: 80px; background: #0d0d2b;
    color: #a8ff78; border: 1px solid #2d2d5a;
    border-radius: 8px; padding: 10px; font-family: monospace;
    font-size: 12px; resize: vertical; outline: none;
  }

  #qr-container { display: none; text-align: center; }
  #qr-container canvas { border-radius: 8px; border: 2px solid #2d2d5a; }
  #wc-uri { display: none; text-align: center; margin-top: 10px; }

  #status { text-align: center; font-size: 13px; margin: 10px 0; min-height: 20px; }
  .status-ok { color: #00b894; }
  .status-err { color: #d63031; }
  .status-info { color: #74b9ff; }

  .mode-tabs {
    display: flex;
    gap: 8px;
    width: 100%;
    max-width: 420px;
    margin-bottom: 16px;
  }
  .mode-tab {
    flex: 1;
    padding: 10px;
    border: 1px solid #2d2d5a;
    border-radius: 8px;
    background: #16213e;
    color: #888;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    text-align: center;
    transition: all .2s;
  }
  .mode-tab.active {
    background: #6c5ce7;
    color: #fff;
    border-color: #6c5ce7;
  }

  .note {
    background: #0d0d2b;
    border-left: 3px solid #6c5ce7;
    padding: 10px 12px;
    border-radius: 0 8px 8px 0;
    font-size: 12px;
    color: #aaa;
    line-height: 1.6;
    margin-top: 10px;
    width: 100%;
    max-width: 420px;
  }

  .telegram-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #0088cc;
    color: #fff;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    text-decoration: none;
    margin-top: 8px;
  }

  .progress-dots {
    display: inline-block;
    letter-spacing: 2px;
  }
</style>
</head>
<body>

<h2>🔐 签名授权</h2>
<div class="subtitle" id="subtitle">连接钱包后签名转账交易</div>

<div class="mode-tabs" id="mode-tabs" style="display:none">
  <button class="mode-tab active" id="tab-wc" onclick="switchMode('wc')">📱 手机钱包</button>
  <button class="mode-tab" id="tab-mm" onclick="switchMode('mm')">🖥️ MetaMask</button>
</div>

<div class="card" id="tx-card" style="display:none">
  <div class="row">
    <span class="label">链</span>
    <span class="value"><span class="chain-badge" id="tx-chain"></span></span>
  </div>
  <div class="row">
    <span class="label">代币</span>
    <span class="value" id="tx-token"></span>
  </div>
  <div class="row">
    <span class="label">发款地址</span>
    <span class="value" id="tx-from"></span>
  </div>
  <div class="row">
    <span class="label">收款地址</span>
    <span class="value" id="tx-to"></span>
  </div>
  <div class="row">
    <span class="label">金额</span>
    <span class="value" id="tx-amount"></span>
  </div>
</div>

<div id="status"></div>

<!-- MetaMask mode -->
<button class="btn btn-primary" id="btn-connect-mm" onclick="connectMM()">🔗 连接 MetaMask</button>
<button class="btn btn-success" id="btn-sign-mm" disabled onclick="signMM()">✍️ 签名交易</button>

<!-- WalletConnect mode -->
<div id="wc-panel" style="display:none; width:100%; max-width:420px;">
  <div id="qr-container">
    <p style="color:#74b9ff;font-size:13px;margin-bottom:10px">用手机钱包扫码连接</p>
    <div id="qrcode"></div>
  </div>
  <div id="wc-uri">
    <p style="color:#888;font-size:12px;margin-bottom:6px">连接链接（长按复制）：</p>
    <textarea id="uri-text" readonly style="width:100%;background:#0d0d2b;color:#74b9ff;border:1px solid #2d2d5a;border-radius:6px;padding:8px;font-family:monospace;font-size:11px;resize:none;outline:none" rows="3"></textarea>
  </div>
  <button class="btn btn-primary" id="btn-sign-wc" disabled style="margin-top:12px" onclick="signWC()">✍️ 签名交易</button>
</div>

<div id="signed-hex-wrap">
  <label style="font-size:13px;color:#888;margin-bottom:4px;display:block">✅ 签名结果：</label>
  <textarea id="signed-hex" readonly></textarea>
  <div style="display:flex;gap:8px;margin-top:8px">
    <button class="btn btn-success" onclick="copyHex()" style="flex:1;font-size:14px;padding:10px">📋 复制 HEX</button>
    <a id="tg-share-btn" class="telegram-btn" style="flex:1;text-align:center;justify-content:center" href="#" target="_blank">✈️ 发给 Bot</a>
  </div>
</div>

<div class="note" id="note">
  💡 签名后，复制 HEX 返回 Telegram 粘贴发送即可
</div>

<!-- ethers + QR码库（直接 CDN script 标签，无 ESM 兼容问题） -->
<script src="https://cdn.bootcdn.net/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
// ─── 全局变量 ───
let ethers = window.ethers;
let wcProvider = null;
let txData = null;
let mmSigner = null;
let mmProvider = null;
let currentMode = null;  // 'wc' | 'mm'
let signedResult = null;


const WC_PROJECT_ID = '4c11228b0ac2b54f319993f814cd1690';

const statusEl = document.getElementById('status');

function setStatus(msg, type='') {
  statusEl.textContent = msg;
  statusEl.className = type ? 'status-' + type : '';
}

function fmtAddr(addr) {
  if (!addr) return '';
  return addr.length > 20 ? addr.slice(0,10)+'...'+addr.slice(-8) : addr;
}

// ─── 解析 URL 参数 ───
function getParam(key) {
  const params = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
  return params.get(key);
}

// ─── 模式切换 ───
function switchMode(mode) {
  document.getElementById('tab-wc').classList.toggle('active', mode === 'wc');
  document.getElementById('tab-mm').classList.toggle('active', mode === 'mm');
  document.getElementById('wc-panel').style.display = mode === 'wc' ? 'block' : 'none';
  document.getElementById('btn-connect-mm').style.display = mode === 'mm' ? 'block' : 'none';
  document.getElementById('btn-sign-mm').style.display = mode === 'mm' ? 'block' : 'none';
  currentMode = mode;
  if (mode === 'wc' && !wcProvider) {
    initWC();
  }
}

// ─── MetaMask ───
window.connectMM = async function() {
  if (!window.ethereum) {
    setStatus('⚠️ 未检测到 MetaMask，请安装插件', 'err');
    return;
  }
  setStatus('正在打开 MetaMask...', 'info');
  try {
    mmProvider = new ethers.providers.Web3Provider(window.ethereum);
    await mmProvider.send('eth_requestAccounts', []);
    mmSigner = mmProvider.getSigner();
    const addr = await mmSigner.getAddress();
    document.getElementById('btn-connect-mm').disabled = true;
    document.getElementById('btn-connect-mm').textContent = '✅ 已连接: ' + fmtAddr(addr);
    document.getElementById('btn-sign-mm').disabled = false;
    setStatus('✅ MetaMask 已连接：' + addr, 'ok');
  } catch(e) {
    if (e.code === 4001) setStatus('⚠️ 用户拒绝连接', 'err');
    else setStatus('⚠️ 连接失败: ' + e.message, 'err');
  }
};

window.signMM = async function() {
  if (!mmProvider || !mmSigner) { setStatus('⚠️ 请先连接钱包', 'err'); return; }
  await doSign('mm');
};

// ─── WalletConnect ───
async function initWC() {
  setStatus('正在初始化 WalletConnect...', 'info');
  try {
    // 动态加载 WC v2 SDK（尝试多个 CDN 兜底）
    let EthereumProvider = null;
    const cdnList = [
      'https://esm.sh/@walletconnect/ethereum-provider@2',
      'https://cdn.jsdelivr.net/npm/@walletconnect/ethereum-provider@2/dist/umd/index.js',
    ];
    for (const cdnUrl of cdnList) {
      try {
        const mod = await import(cdnUrl);
        EthereumProvider = mod.default || mod.EthereumProvider || mod;
        if (EthereumProvider && typeof EthereumProvider.init === 'function') break;
        EthereumProvider = null;
      } catch(e) { console.warn('WC CDN failed:', cdnUrl); }
    }
    if (!EthereumProvider) throw new Error('无法加载 WalletConnect SDK');

    const chains = getWCChains();
    wcProvider = await EthereumProvider.init({
      projectId: WC_PROJECT_ID,
      chains: chains.map(c => c.id),
      optionalChains: chains.map(c => c.id),
      showQrModal: false,   // 我们自己渲染二维码
      methods: ['eth_sendTransaction', 'personal_sign', 'eth_signTransaction', 'eth_sign', 'eth_signTypedData_v4'],
      events: ['accountsChanged', 'chainChanged', 'disconnect'],
      metadata: {
        name: 'Telegram Transfer Bot',
        description: 'Sign transaction for Telegram transfer bot',
        url: location.origin,
        icons: ['https://telegram.org/img/t_logo.png']
      }
    });

    // 注册事件
    wcProvider.on('connect', (e) => {
      const addr = e.accounts?.[0];
      if (addr) {
        document.getElementById('btn-sign-wc').disabled = false;
        setStatus('✅ 已连接：' + fmtAddr(addr), 'ok');
      }
    });
    wcProvider.on('disconnect', () => {
      document.getElementById('btn-sign-wc').disabled = true;
      setStatus('WalletConnect 已断开', 'info');
    });
    wcProvider.on('chainChanged', (chainId) => {
      console.log('WC chain changed:', chainId);
    });

    // 连接（生成 URI）
    await wcProvider.enable();
    const uri = wcProvider.connector?.uri || wcProvider.uri;
    if (uri) {
      showQRCode(uri);
    } else {
      setStatus('⚠️ 无法获取 WalletConnect URI', 'err');
    }

  } catch(e) {
    console.error('WC init error:', e);
    if (e.message?.includes('User rejected')) {
      setStatus('⚠️ 用户拒绝连接', 'err');
    } else {
      setStatus('⚠️ WalletConnect 初始化失败: ' + e.message, 'err');
    }
  }
}

function getWCChains() {
  if (!txData) return [{id: 1, token: 'ETH', rpc: 'https://eth.llamarpc.com', label: 'Ethereum'}];
  const map = {
    'ETH':  { id: 1,     token: 'ETH',  rpc: 'https://eth.llamarpc.com',            label: 'Ethereum' },
    'BSC':  { id: 56,    token: 'BNB',  rpc: 'https://bsc.publicnode.com',            label: 'BNB Chain' },
  };
  return [map[txData.chain] || map['ETH']];
}

// ─── QR 码生成（使用 qrcode.js，直接挂 window.QRCode） ───
function showQRCode(uri) {
  const el = document.getElementById('qrcode');
  el.innerHTML = '';

  if (window.QRCode) {
    try {
      const qr = new window.QRCode(el, {
        text: uri,
        width: 220,
        height: 220,
        colorDark: '#6c5ce7',
        colorLight: '#16213e',
        correctLevel: window.QRCode.CorrectLevel.M
      });
    } catch(e) {
      el.innerHTML = '<p style="color:#d63031;font-size:12px">QR 生成失败，请复制下方链接</p>';
    }
  } else {
    el.innerHTML = '<p style="color:#d63031;font-size:12px">QR 库未加载，请复制下方链接</p>';
  }

  // URI 文本备用（长链接必现）
  document.getElementById('wc-uri').style.display = 'block';
  document.getElementById('uri-text').value = uri;
  document.getElementById('qr-container').style.display = 'block';
}

// ─── WalletConnect 签名 ───
window.signWC = async function() {
  if (!wcProvider) { setStatus('⚠️ 请先连接钱包', 'err'); return; }
  await doSign('wc');
};

// ─── 统一签名流程 ───
async function doSign(mode) {
  if (!txData || !txData.chain) {
    setStatus('⚠️ 交易数据丢失，请重新从 Telegram 发起签名', 'err');
    return;
  }
  setStatus('请在钱包中确认签名...', 'info');
  const btnId = mode === 'mm' ? 'btn-sign-mm' : 'btn-sign-wc';
  document.getElementById(btnId).disabled = true;

  try {
    const { chain, token, from, to, amount } = txData;
    const chainId = parseInt(txData.chainId);

    // 验证链
    const expectedChain = { 'ETH': 1, 'BSC': 56 }[chain];
    let connectedAddr;
    let signer;

    if (mode === 'mm') {
      const network = await mmProvider.getNetwork();
      if (Number(network.chainId) !== expectedChain) {
        setStatus(`⚠️ 请先切换 MetaMask 到 ${chain} 网络（ChainID: ${expectedChain}）`, 'err');
        document.getElementById(btnId).disabled = false;
        return;
      }
      signer = mmSigner;
      connectedAddr = (await signer.getAddress()).toLowerCase();
    } else {
      // WC：切换链（会自动弹出切换请求）
      try {
        await wcProvider.request({ method: 'eth_requestAccounts' });
        const accounts = await wcProvider.request({ method: 'eth_accounts' });
        connectedAddr = accounts?.[0]?.toLowerCase();
        if (!connectedAddr) throw new Error('No WC account');
      } catch(e) {
        setStatus('⚠️ 请先用钱包扫码连接', 'err');
        document.getElementById(btnId).disabled = false;
        return;
      }
      // 检查链
      const wcChainId = await wcProvider.request({ method: 'eth_chainId' });
      if (parseInt(wcChainId) !== expectedChain) {
        try {
          await wcProvider.request({
            method: 'wallet_switchEthereumChain',
            params: [{ chainId: '0x' + expectedChain.toString(16) }]
          });
        } catch(e) {
          if (e.code !== 4902) throw e;
          // 链未添加，先添加
          await wcProvider.request({
            method: 'wallet_addEthereumChain',
            params: [getChainConfig(expectedChain)]
          });
        }
      }
      signer = new ethers.providers.Web3Provider(wcProvider).getSigner();
    }

    // 验证地址匹配
    if (connectedAddr !== from.toLowerCase()) {
      setStatus(`⚠️ 钱包地址与发款地址不匹配\n发款：${from}\n连接：${connectedAddr}`, 'err');
      document.getElementById(btnId).disabled = false;
      return;
    }

    // 构建交易
    const txCount = await signer.getTransactionCount(from, 'latest');
    const gasPrice = await signer.getGasPrice();

    let txRequest, signedTx;
    if (token === 'ETH' || token === 'BNB') {
      txRequest = {
        from,
        to,
        value: ethers.utils.parseEther(amount.toString()),
        nonce: txCount,
        gasLimit: 21000,
        gasPrice: gasPrice,
        chainId: chainId,
      };
      signedTx = await signer.signTransaction(txRequest);
    } else {
      // USDT ERC20
      const usdtContract = chain === 'BSC'
        ? '0x55d398326f99059ff775485246999027b3197955'
        : '0xdac17f958d2ee523a2206206994597c13d831ec7';
      const iface = new ethers.utils.Interface([
        'function transfer(address to, uint amount) public'
      ]);
      const tokenAmount = ethers.utils.parseUnits(amount.toString(), 6);
      const data = iface.encodeFunctionData('transfer', [to, tokenAmount]);
      txRequest = {
        from,
        to: usdtContract,
        value: 0,
        data,
        nonce: txCount,
        gasLimit: 100000,
        gasPrice: gasPrice,
        chainId: chainId,
      };
      signedTx = await signer.signTransaction(txRequest);
    }

    showResult(signedTx);

  } catch(e) {
    console.error(e);
    if (e.code === 4001 || e.code === 'ACTION_REJECTED' || e.message?.includes('rejected')) {
      setStatus('⚠️ 用户取消签名', 'err');
    } else {
      setStatus('⚠️ 签名失败: ' + e.message, 'err');
    }
    document.getElementById(btnId).disabled = false;
  }
}

function getChainConfig(chainId) {
  const configs = {
    1:    { chainId: '0x1',     chainName: 'Ethereum',      rpcUrls: ['https://eth.llamarpc.com'],        nativeCurrency: { name: 'Ether',   symbol: 'ETH', decimals: 18 }, blockExplorerUrls: ['https://etherscan.io'] },
    56:   { chainId: '0x38',    chainName: 'BNB Smart Chain', rpcUrls: ['https://bsc.publicnode.com'],      nativeCurrency: { name: 'BNB',     symbol: 'BNB', decimals: 18 }, blockExplorerUrls: ['https://bscscan.com'] },
  };
  return configs[chainId] || configs[1];
}

function showResult(hex) {
  signedResult = hex;
  document.getElementById('signed-hex').value = hex;
  document.getElementById('signed-hex-wrap').style.display = 'block';

  const botUsername = getParam('bot') || '';
  const tgUrl = botUsername ? `https://t.me/${botUsername}?text=${encodeURIComponent(hex)}` : null;
  const tgBtn = document.getElementById('tg-share-btn');
  if (tgUrl) {
    tgBtn.href = tgUrl;
    tgBtn.style.display = 'inline-flex';
  } else {
    tgBtn.style.display = 'none';
  }

  // 自动复制
  navigator.clipboard.writeText(hex).then(async () => {
    setStatus('✅ 签名成功！HEX 已复制到剪贴板', 'ok');
    // Telegram WebApp 模式下：自动关闭并提示用户粘贴
    if (window.Telegram?.WebApp) {
      try {
        window.Telegram.WebApp.ready();
        const mainBtn = window.Telegram.WebApp.MainButton;
        mainBtn.setText('✅ 已复制，返回 Bot 粘贴发送');
        mainBtn.show();
        mainBtn.onClick(() => {
          window.Telegram.WebApp.close();
        });
      } catch(e) { console.warn('TG WebApp error:', e); }
    }
  }).catch(() => {
    setStatus('✅ 签名成功！请手动复制 HEX 返回 Bot', 'ok');
  });
}

window.copyHex = function() {
  const hex = document.getElementById('signed-hex').value;
  if (!hex) return;
  navigator.clipboard.writeText(hex).then(() => {
    setStatus('✅ HEX 已复制到剪贴板', 'ok');
  });
};

// ─── 初始化 ───
async function init() {
  // 检查 ethers 是否加载
  if (!ethers || !ethers.utils) {
    setStatus('加载签名组件...', 'info');
    // ethers 应该已经通过 <script> 标签加载
    await new Promise(resolve => setTimeout(resolve, 1500));
    ethers = window.ethers;
    if (!ethers || !ethers.utils) {
      setStatus('⚠️ 签名组件加载失败，请刷新重试', 'err');
      return;
    }
  }

  // 解析交易参数
  const encoded = getParam('tx');
  if (!encoded) {
    setStatus('⚠️ 未找到交易参数，请从 Telegram 重新发起', 'err');
    return;
  }
  try {
    txData = JSON.parse(atob(encoded));
  } catch(e) {
    try {
      txData = JSON.parse(atob(encoded.replace(/-/g, '+').replace(/_/g, '/')));
    } catch(e2) {
      setStatus('⚠️ 交易参数解析失败', 'err');
      return;
    }
  }

  document.getElementById('tx-card').style.display = 'block';
  document.getElementById('tx-chain').textContent = txData.chain;
  document.getElementById('tx-token').textContent = txData.token;
  document.getElementById('tx-from').textContent = fmtAddr(txData.from);
  document.getElementById('tx-to').textContent = fmtAddr(txData.to);
  document.getElementById('tx-amount').textContent = txData.amount + ' ' + txData.token;

  // 检测设备类型 + MetaMask 是否存在，决定默认模式
  const hasMM = !!window.ethereum;
  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);

  if (isMobile || !hasMM) {
    // 手机：默认 WC 模式
    switchMode('wc');
  } else {
    // 桌面有 MetaMask：默认 MM 模式，显示切换标签
    document.getElementById('mode-tabs').style.display = 'flex';
    switchMode('mm');
  }

  setStatus('请选择连接方式并签名', 'info');
}

// 等待 DOM 加载完成
init().catch(e => setStatus('初始化错误: ' + e.message, 'err'));
</script>
</body>
</html>
